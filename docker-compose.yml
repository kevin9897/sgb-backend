# Docker Compose por defecto del repositorio Backend
services:
  db:
    image: postgres:16-alpine
    container_name: sgb_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgb123}
      POSTGRES_DB: ${POSTGRES_DB:-sgb_madeira}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgb}"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sgb_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sgb:sgb123@db:5432/sgb_madeira}
      SECRET_KEY: ${SECRET_KEY:-clave_desarrollo_madeira}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
