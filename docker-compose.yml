# Docker Compose por defecto del repositorio Backend (conectado a Supabase mediante .env)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sgb_backend
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
