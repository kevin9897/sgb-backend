databases:
  - name: sgb-db
    databaseName: sgb_madeira
    user: sgb
    plan: free

services:
  - type: web
    name: sgb-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sgb-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tu-app.vercel.app
