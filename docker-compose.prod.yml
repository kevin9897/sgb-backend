# Docker Compose modo PRODUCCIÓN - Repositorio Backend (conectado a Supabase mediante .env)
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: sgb_backend_prod
    restart: always
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://tu-app.vercel.app}
    ports:
      - "8000:8000"
